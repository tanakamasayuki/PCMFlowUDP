name=PCMFlowUDP
version=0.1.0
author=TANAKA Masayuki
maintainer=TANAKA Masayuki
sentence=UDP transport adapter for PCMFlow. Raw UDP plus a VBAN-interoperable subset (audio + service ping) for streaming PCM between Arduino devices and PCs.
paragraph=Plugs PCMFlow's PCMSource / PCMSink / ByteStream / ByteSink interfaces onto UDP. Provides RawUdpSink / RawUdpStream for caller-defined payloads and VbanSender / VbanReceiver for interoperability with VB-Audio Voicemeeter and VBAN Receptor (audio sub-protocol subset; not a full VBAN implementation). Codes against the Arduino UDP base class, so it works with WiFiUDP on ESP32 and on the lang-ship:host (1.0.6+) test target. No third-party vendored code; MIT.
category=Communication
url=https://github.com/tanakamasayuki/PCMFlowUDP
architectures=*
depends=PCMFlow
includes=PCMFlowUDP.h
