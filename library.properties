name=PCMFlowUDP
version=1.0.0
author=TANAKA Masayuki
maintainer=TANAKA Masayuki
sentence=UDP transport adapter for PCMFlow. Raw UDP, VBAN PCM, and RTP (PCMU / PCMA / G722 / L16 / Opus payload types) for streaming audio between Arduino devices and PCs.
paragraph=Plugs PCMFlow's PCMSource / PCMSink / ByteStream / ByteSink interfaces onto UDP. Provides RawUdpSink / RawUdpStream for caller-defined payloads, VbanSender / VbanReceiver for VB-Audio Voicemeeter and VBAN Receptor interop (PCM subset of VBAN), and RtpSender / RtpReceiver for VoIP / WebRTC interop via standard RFC 3550 / 3551 / 7587 payload types. Codes against the Arduino UDP base class, so it works with WiFiUDP on ESP32 and on the lang-ship:host test target. No third-party vendored code; MIT.
category=Communication
url=https://github.com/tanakamasayuki/PCMFlowUDP
architectures=*
depends=PCMFlow
includes=PCMFlowUDP.h
